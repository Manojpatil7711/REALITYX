[project]
name = "realityx-backend"
version = "0.1.0"
description = "Secure evidence-based digital media verification API"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.117.1",
  "uvicorn[standard]==0.36.0",
  "pydantic==2.11.9",
  "python-multipart==0.0.20",
  "Pillow==11.3.0",
  "numpy==2.3.3",
  "cryptography==46.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
